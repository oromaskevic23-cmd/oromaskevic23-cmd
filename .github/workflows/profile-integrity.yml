name: Enterprise Founder Profile Integrity
on:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/imperial-core-skyline-original-20261029.jpg
      - assets/imperial-core-emblem.webp
      - assets/alexander-romaskevich-portrait-original-20261029.jpg
      - tools/verify_profile.py
      - tests/test_verify_profile.py
      - .github/workflows/profile-integrity.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified SHA
        with:
          persist-credentials: false
      - name: Check founder identity, flagship claims, evidence and link structure
        run: python3 tools/verify_profile.py
      - name: Exercise profile integrity checks
        run: python3 -m unittest discover -s tests -p 'test_verify_profile.py' -v
