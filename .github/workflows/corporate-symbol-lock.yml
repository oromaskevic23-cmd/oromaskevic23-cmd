name: IMPERIAL Core | Canonical Corporate Symbol Integrity

on:
  push:
    branches: [main]
    paths:
      - 'brand/**'
      - 'assets/imperial-core-emblem.webp'
      - 'tools/check_corporate_symbol.py'
      - 'tests/test_corporate_symbol_lock.py'
      - '.github/workflows/corporate-symbol-lock.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-official-emblem:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with no persistent credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify original GitHub emblem by object fingerprint
        run: python3 tools/check_corporate_symbol.py
      - name: Test that substitutions and randomization are rejected
        run: python3 -m unittest discover -s tests -p 'test_corporate_symbol_lock.py' -v
