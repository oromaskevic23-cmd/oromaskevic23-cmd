name: IMPERIAL Enterprise Quality Policy - Self Tests
on:
  push:
    branches: [main]
    paths:
      - 'tools/imperial_enterprise_gate.py'
      - 'tests/test_imperial_enterprise_gate.py'
      - '.github/workflows/imperial-policy-tests.yml'
  pull_request:
    paths:
      - 'tools/imperial_enterprise_gate.py'
      - 'tests/test_imperial_enterprise_gate.py'
      - '.github/workflows/imperial-policy-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python policy self-tests
        run: python3 -m unittest discover -s tests -p 'test_imperial_enterprise_gate.py' -v
      - name: Compile policy source
        run: python3 -m py_compile tools/imperial_enterprise_gate.py
      - name: Review new changes using fail-closed policy
        env:
          IMPERIAL_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          IMPERIAL_CI_HEAD: ${{ github.sha }}
        run: python3 tools/imperial_enterprise_gate.py --root .
